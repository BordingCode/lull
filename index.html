<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1017" />
  <title>Lull — baby sleep &amp; feeding tracker</title>
  <meta name="description" content="One-tap baby sleep, feeding and diaper tracking with next-nap predictions. Works offline, data stays on your phone." />
  <link rel="manifest" href="manifest.json?v=10" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lull" />
  <link rel="stylesheet" href="css/style.css?v=10" />
</head>
<body>
  <div id="app" hidden>
    <header class="topbar">
      <div class="baby">
        <b id="baby-name">Baby</b>
        <span id="baby-age"></span>
      </div>
      <button class="iconbtn" id="btn-theme" title="Switch colours" aria-label="Switch colours">🌙</button>
      <button class="iconbtn" id="btn-settings" title="Settings" aria-label="Settings">⚙️</button>
    </header>

    <main id="screen" aria-live="polite"></main>

    <nav class="tabbar" id="tabs" aria-label="Sections">
      <button data-tab="home"     aria-current="page"><span class="emoji">🏠</span>Home</button>
      <button data-tab="log"><span class="emoji">📋</span>Log</button>
      <button data-tab="patterns"><span class="emoji">📊</span>Patterns</button>
      <button data-tab="sounds"><span class="emoji">🎵</span>Sounds</button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" aria-live="polite"></div>

  <!-- First run: we only need a name and a birth date -->
  <section class="onboard" id="onboard" hidden>
    <div class="inner">
      <div class="logo" aria-hidden="true">🌙</div>
      <h1>Lull</h1>
      <p>Sleep, feeds and diapers in one tap — plus a sensible guess at the next nap.</p>
      <div class="field" style="text-align:left">
        <label for="ob-name">Baby's name</label>
        <input id="ob-name" type="text" placeholder="e.g. Alba" autocomplete="off" />
      </div>
      <div class="field" style="text-align:left">
        <label for="ob-birth">Birth date</label>
        <input id="ob-birth" type="date" />
      </div>
      <button class="btn" id="ob-go">Start tracking</button>
      <p class="faint" style="margin-top:16px">Everything stays on this phone. Nothing is uploaded.</p>
    </div>
  </section>

  <script type="module" src="js/app.js?v=10"></script>
  <!-- hub-stats visit counter -->
  <script>(function(){try{var A="lull",K="hubdev",d=localStorage.getItem(K);if(!d){d=(self.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+"."+Math.random().toString(36).slice(2));localStorage.setItem(K,d);}var u="https://hub-stats.mathiasjob.workers.dev/hit",b=JSON.stringify({app:A,d:d});if(navigator.sendBeacon){navigator.sendBeacon(u,b);}else{fetch(u,{method:"POST",body:b,keepalive:true,mode:"no-cors"});}}catch(e){}})();</script>
</body>
</html>
